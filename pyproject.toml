[project]
name = "local-ai-agent"
version = "0.1.0"
description = "개인 AI 에이전트 엔진 (로컬 Qwen3-8B 우선)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
push = ["h2>=4", "cryptography>=42"]   # 푸시 알림(APNs): HTTP/2, ES256 서명

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 실제 Ollama 서버와 모델이 필요한 테스트 (RUN_INTEGRATION=1일 때만 실행)",
]
